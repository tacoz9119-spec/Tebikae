<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tebikae</title>
<meta name="theme-color" content="#F5F6F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tebikae">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" id="touchIcon" href="icon-180.png">
<script>
/* ホーム画面のアイコン：ホーム画面に追加したときの外観がダークならダーク用、ライトなら明るい方のアイコンを使う（Kousei・Hongaki・Bunpituと同じ） */
(function(){
  var l=document.getElementById('touchIcon'), m=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)');
  function u(){ l.href=(m&&m.matches)?'icon-180-dark.png':'icon-180.png'; }
  u(); if(m){ if(m.addEventListener) m.addEventListener('change',u); else if(m.addListener) m.addListener(u); }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<script src="firebase-config.js"></script>
<script src="firebase.js"></script>
<style>
/* Layout: カテゴリ › メモの一覧 › 開いたメモ。iPhoneは1面ずつ、iPadの縦は一覧とメモの2列、iPadの横とMacは3列 */
:root{
  --bg:#F5F6F6; --surface:#FCFCFB; --sunken:#ECEEEE; --weak:#E6E9E9; --fg:#1D2224; --fg2:#3A4244; --muted:#5C6668;
  --line:#CDD2D3; --line2:#C3C8C9; --sep:#DCE0E1; --mark:#2D5B8C; --caret:#2563EB; --danger:#B3261E; --on:#FCFCFB;
  --overlay:rgba(29,34,36,.45); --shadow:rgba(29,34,36,.16);
  --font:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --dfs:0px; --fs:16px; --rh:40px; --bw:26px; --ts:22px; --rowh:50px; --rowf:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131718; --surface:#1E2325; --sunken:#262C2E; --weak:#2A3133; --fg:#E7E4DD; --fg2:#C9CCC8; --muted:#98A2A4;
  --line:#343C3E; --line2:#3E4749; --sep:#2C3335; --mark:#8DB4E2; --caret:#6EA8FE; --danger:#F2B8B5; --on:#131718;
  --overlay:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#131718; --surface:#1E2325; --sunken:#262C2E; --weak:#2A3133; --fg:#E7E4DD; --fg2:#C9CCC8; --muted:#98A2A4;
  --line:#343C3E; --line2:#3E4749; --sep:#2C3335; --mark:#8DB4E2; --caret:#6EA8FE; --danger:#F2B8B5; --on:#131718;
  --overlay:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.5); color-scheme:dark;
}
:root.sz-l{--dfs:2px} :root.sz-s{--dfs:-1px}
@media (min-width:760px) and (pointer:fine){:root{--fs:15px; --rh:32px; --bw:22px; --ts:21px; --rowh:36px; --rowf:14px}}
@media (min-width:760px) and (pointer:coarse){:root{--fs:17px; --rh:42px; --ts:24px; --rowh:44px; --rowf:15px}}

[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--caret);outline-offset:2px}
textarea:focus-visible,input:focus-visible,[contenteditable]:focus-visible{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
/* iPhoneのホーム画面から開いたとき、時計などの帯の下を地の色でふさぐ。ふさがないと、上の帯（Tebikaeの文字やボタン）がぼかされて暗く見える（Kousei・Bunpituと同じ指定） */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.ib{width:34px;height:34px;flex:none;display:inline-flex;align-items:center;justify-content:center;padding:0;border:0;border-radius:7px;background:transparent;color:var(--muted)}
.ib:hover{background:var(--sunken);color:var(--fg)}
.ib:disabled{opacity:.3;cursor:default;background:transparent}
@media (max-width:759px),(pointer:coarse){.ib{width:44px;height:44px;border-radius:8px}}
.btn{min-height:34px;padding:0 14px;border:1px solid var(--line2);border-radius:7px;background:var(--surface);color:var(--fg);font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--fg)}
.btn.pri{background:var(--fg);border-color:var(--fg);color:var(--on);font-weight:500}
.btn:disabled{opacity:.4;cursor:default}
@media (pointer:coarse){.btn{min-height:44px;font-size:15px}}

/* 上の帯 */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;flex:none;display:flex;align-items:center;gap:10px;background:var(--bg);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
.brand{font-size:18px;letter-spacing:.02em}
.spacer{flex:1}
.search{display:flex;align-items:center;gap:8px;width:280px;height:34px;padding:0 10px;border-radius:8px;background:var(--sunken);color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:14px;color:var(--fg);outline:none}
.search input::placeholder{color:var(--muted);opacity:1}
.status{font-size:12px;color:var(--muted);white-space:nowrap}
.status.bad{color:var(--danger)}
#bSearch{display:none}

#main{flex:1;min-height:0;display:flex;gap:20px;padding-block:22px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
.pn{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.ph{display:flex;align-items:baseline;gap:8px;height:43px;padding:12px 2px 8px;margin-bottom:8px;border-bottom:1px solid var(--line);font-size:14px}
.ph .n{margin-left:auto;font-size:12px;color:var(--muted)}

/* カテゴリ（横の広い画面の左の列） */
#side{width:210px;flex:none;align-self:flex-start;max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:1px;padding:0 10px 10px}
.si{display:flex;align-items:center;gap:8px;width:100%;min-height:34px;padding:5px 10px;border:0;border-radius:8px;background:transparent;color:var(--fg2);font-size:14px;text-align:left}
.si .n{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.si:hover{background:var(--sunken)}
.si.on{background:var(--weak);color:var(--fg);font-weight:700}
.si.on .n{font-weight:400}
.si span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dash{min-height:32px;margin-top:8px;border:1.5px dashed var(--line2);border-radius:8px;background:transparent;color:var(--fg);font-size:13px;font-weight:500}
.dash:hover{border-color:var(--fg)}
.archlink{display:flex;align-items:center;gap:6px;min-height:32px;margin-top:12px;padding:10px 8px 0;border:0;border-top:1px solid var(--line);background:transparent;color:var(--muted);font-size:13px;text-align:left}
.archlink.on{color:var(--fg);font-weight:700}
@media (pointer:coarse){.si{min-height:42px;font-size:15px}.dash{min-height:40px}.archlink{min-height:40px}}

/* メモの一覧 */
#listCol{width:360px;flex:none;display:flex;flex-direction:column;padding:0 10px 10px;overflow:hidden}
.tabs{display:none;flex:none;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:5px;min-height:42px;padding:0 12px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--fg2);font-size:14px;white-space:nowrap}
.tab.on{color:var(--fg);font-weight:700;border-bottom-color:var(--fg)}
.tab .n{font-size:11px;font-weight:400;color:var(--muted)}
.lhead{position:relative;padding-left:14px;margin-bottom:10px}
.lhead::before{content:"";position:absolute;left:2px;top:15px;width:4px;height:16px;border-radius:2px;background:var(--mark)}
.lhead b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qform{flex:none;display:flex;gap:6px}
.qform input{flex:1;min-width:0;height:34px;padding:0 10px;border:1px solid transparent;border-radius:8px;background:var(--sunken);color:var(--fg);font-size:14px}
.qform input:focus{background:var(--surface);border-color:var(--fg)}
.qform input::placeholder{color:var(--muted);opacity:1}
.qform .go{display:inline-flex;width:34px;height:34px;flex:none;align-items:center;justify-content:center;padding:0;border:0;border-radius:8px;background:var(--fg);color:var(--on)}
.qform .go:focus-visible{outline:2px solid var(--caret);outline-offset:2px}
@media (pointer:coarse){ .qform input{height:44px;padding:0 14px;border-radius:10px;font-size:16px} .qform .go{width:44px;height:44px;border-radius:10px} }
.sbar{flex:none;display:flex;align-items:center;gap:8px;padding:8px 0}
.sbar .search{flex:1;width:auto;height:40px}
.sbar .search input{font-size:16px}
.rows{flex:1;min-height:0;overflow-y:auto;margin-top:10px}
.row{position:relative;display:flex;align-items:center;border-radius:8px;background:var(--surface)}
.rin{position:relative;z-index:1;flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:inherit;border-radius:inherit;touch-action:pan-y}
.row+.row::before{content:"";position:absolute;z-index:2;top:0;left:10px;right:10px;height:1px;background:var(--sep)}
.swbg{position:absolute;inset:0;z-index:0;display:none;align-items:center;justify-content:space-between;padding:0 18px;border-radius:inherit;color:var(--on);font-size:14px;font-weight:700}
.swbg span{display:inline-flex;align-items:center;gap:6px}
.row.sw{overflow:hidden}
.row.sw .swbg{display:flex}
.row[data-dir="r"] .swbg{background:var(--mark)}
.row[data-dir="l"] .swbg{background:var(--danger)}
.row[data-dir="r"] .swd,.row[data-dir="l"] .swa{visibility:hidden}
.row.sw:not(.arm) .swbg{opacity:.55}
.row.sw .rin{box-shadow:0 0 0 1px var(--sep)}
.row.on{background:var(--weak)}
.row.on::before,.row.on+.row::before{display:none}
.rmain{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:var(--rowh);padding:0 10px;border:0;background:transparent;color:var(--fg);text-align:left}
.rt{flex:1;min-width:0;font-size:calc(var(--rowf) + var(--dfs));line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt.none{color:var(--muted)}
.row.on .rt{font-weight:500}
.rsub{display:block;font-size:12px;line-height:1.5;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtw{flex:1;min-width:0;display:flex;flex-direction:column;padding:6px 0}
.ex{flex:none;display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mgrip{flex:none;align-self:stretch;width:26px;display:flex;align-items:center;justify-content:center;margin-right:-8px;padding:0;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:grab;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.mgrip:hover{color:var(--fg)}
.row.dragging{z-index:3;background:var(--surface);border-radius:10px;box-shadow:0 8px 22px var(--shadow)}
.row.dragging::before,.row.dragging+.row::before{display:none}
.row.dragging .mgrip{cursor:grabbing;color:var(--caret)}
.row.shift{transition:transform .16s ease}
.rbtn{flex:none;margin-right:6px;min-height:30px;padding:0 10px;border:1px solid var(--line2);border-radius:7px;background:var(--surface);color:var(--fg);font-size:12.5px}
.rbtn:hover{border-color:var(--fg)}
.empty{margin:0;padding:24px 10px;font-size:13px;line-height:1.7;color:var(--muted);text-align:center}
@media (pointer:coarse){.rbtn{min-height:36px;font-size:13px}}

/* 開いたメモ */
#memoCol{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.mhead{flex:none;display:flex;align-items:center;gap:6px;min-height:50px;margin:0 14px 0 24px;border-bottom:1px solid var(--line)}
.back{display:none;align-items:center;gap:2px;min-height:44px;max-width:45%;margin-left:-6px;padding:0 8px 0 0;border:0;background:transparent;color:var(--fg);font-size:15px}
.back span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px;height:28px;max-width:180px;padding:0 6px 0 9px;border:1px solid var(--line2);border-radius:7px;background:var(--surface);color:var(--fg);font-size:12.5px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mdate{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.wtools{flex:none;display:flex;align-items:center;gap:8px;padding:12px 24px 0}
.tb{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.tb button{min-width:36px;height:32px;display:inline-flex;align-items:center;justify-content:center;padding:0 8px;border:0;border-left:1px solid var(--line);background:transparent;color:var(--fg);font-size:13px}
.tb button:first-child{border-left:0}
.tb button:hover{background:var(--sunken)}
.g-b{font-weight:700}.g-i{font-style:italic;font-family:Georgia,"Times New Roman",serif;font-size:15px}.g-s{text-decoration:line-through}
.mscroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;border-top:8px solid transparent;padding:10px 28px 200px}
.mcol{position:relative;max-width:720px}
.abanner{display:flex;align-items:center;gap:10px;margin:0 0 14px;padding:8px 12px;border-radius:8px;background:var(--sunken);font-size:13px;color:var(--fg2)}
.mt,.mb{display:block;width:100%;margin:0;padding:0;border:0;background:transparent;resize:none;overflow:hidden;outline:none;caret-color:var(--caret)}
.mt{font-size:calc(var(--ts) + var(--dfs));font-weight:500;line-height:1.45;color:var(--fg)}
.mb{font-size:calc(var(--fs) - 1px + var(--dfs));line-height:1.75;color:var(--fg2)}
.lwrap{position:relative}
.lwb{margin-top:6px}
.lwb.quiet{display:none}
.lview{position:absolute;inset:0;white-space:pre-wrap;overflow-wrap:break-word;cursor:text}
.lview[hidden]{display:none}
.mtv{font-size:calc(var(--ts) + var(--dfs));font-weight:500;line-height:1.45;color:var(--fg)}
.mbv{font-size:calc(var(--fs) - 1px + var(--dfs));line-height:1.75;color:var(--fg2)}
.lwrap.on textarea{color:transparent}
.lview a,.tx a{color:var(--caret);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;overflow-wrap:anywhere;cursor:pointer}
.tx.lk{cursor:text}
.row2.done .tx a{color:var(--muted)}
.mt::placeholder,.mb::placeholder{color:var(--muted);opacity:1}
.expand{display:flex;align-items:center;justify-content:center;gap:8px;min-width:200px;min-height:44px;margin-top:22px;padding:0 20px;border:1.5px dashed var(--line2);border-radius:10px;background:transparent;color:var(--fg);font-size:14px;font-weight:500}
.expand:hover{border-color:var(--fg)}
.hidebar{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;margin:10px 0 0;font-size:12.5px;color:var(--muted)}
.lnk{min-height:30px;padding:0 6px;border:0;border-radius:6px;background:transparent;color:var(--fg);font-size:12.5px;text-decoration:underline;text-underline-offset:2px}
.outline{margin:12px 0 0 -6px}
.architems{display:inline-flex;align-items:center;gap:6px;min-height:36px;margin-top:20px;padding:0 10px 0 6px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:13px}
.architems:hover{background:var(--sunken)}
.mempty{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;font-size:14px;line-height:1.8;color:var(--muted);text-align:center}
.keys{display:none}
@media (min-width:760px) and (pointer:fine){
  .keys{flex:none;display:flex;flex-wrap:wrap;gap:4px 16px;margin:0 24px;padding:10px 0 12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
  .keys b{font-weight:500;color:var(--fg2);margin-right:5px}
}

/* 項目 */
.row2{display:flex;align-items:flex-start;gap:2px;padding:0 2px 0 6px;border-radius:8px}
.row2:focus-within{background:var(--weak)}
.row2:focus-within .dot{background:var(--caret)}
.bul{flex:none;width:var(--bw);height:var(--rh);display:flex;align-items:center;justify-content:center;padding:0;border:0;background:transparent;cursor:grab;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.dot{width:6px;height:6px;border-radius:50%;background:var(--fg);transition:transform .12s ease}
.bul:hover .dot{transform:scale(1.4)}
.dot.cl{box-shadow:0 0 0 3px var(--line)}
.tx{flex:1;min-width:0;min-height:var(--rh);padding:calc((var(--rh) - (var(--fs) + var(--dfs)) * 1.5) / 2) 0;font-size:calc(var(--fs) + var(--dfs));line-height:1.5;color:var(--fg);outline:none;caret-color:var(--caret);overflow-wrap:anywhere;white-space:pre-wrap;scroll-margin-top:70px;scroll-margin-bottom:60px}
.tx b{font-weight:700}
.row2.done .tx{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.row2.done .dot{background:var(--muted)}
.tog{flex:none;display:inline-flex;align-items:center;justify-content:flex-end;gap:2px;height:var(--rh);min-width:var(--rh);padding:0 6px;border:0;background:transparent;color:var(--muted);font-size:13px}
.kids{margin-left:calc(6px + var(--bw) / 2 - .5px);padding-left:4px;border-left:1px solid var(--line)}
@media (max-width:759px){.kids{padding-left:0}}
.item.dragsrc{opacity:.35}
.dropline{position:absolute;z-index:4;height:2px;border-radius:1px;background:var(--caret);pointer-events:none}
.ghost{position:fixed;left:0;top:0;z-index:60;max-width:240px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 8px 22px var(--shadow);pointer-events:none}
body.nosel{-webkit-user-select:none;user-select:none}

/* iPhoneで入力中の行の上に出す道具 */
.ftools{position:absolute;z-index:5;display:flex;border:1px solid var(--line2);border-radius:10px;background:var(--surface);box-shadow:0 6px 18px var(--shadow);overflow:hidden}
.ftools button{width:44px;height:42px;display:inline-flex;align-items:center;justify-content:center;padding:0;border:0;border-left:1px solid var(--line);background:transparent;color:var(--fg)}
.ftools button:first-child{border-left:0}
.ftools button:active{background:var(--sunken)}
.ftools .gs{display:none}
.ftools.sel .gm{display:none}
.ftools.sel .gs{display:inline-flex}
.ftools.sel .gs:first-of-type{border-left:0}

/* シート */
.ov{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-start;justify-content:center;background:var(--overlay);
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:460px;max-height:min(100%, calc(100vh - 64px));overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:22px;border-radius:14px;background:var(--surface);color:var(--fg);box-shadow:0 18px 48px var(--shadow)}
.sheet:focus{outline:none}
.sheet h2{margin:0;font-size:17px;font-weight:700;line-height:1.45;overflow-wrap:anywhere}
.sheet h3{margin:8px 0 0;padding-bottom:6px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;color:var(--fg2)}
.sheet p{margin:0;font-size:13px;line-height:1.7;color:var(--fg2)}

/* 設定（Hongakiのパネルと同じ寸法） */
.sheet.panel{max-width:600px;gap:16px;padding:20px;border-radius:12px}

.sheet.panel .btn,.sheet.panel .seg button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:30px;padding:0 14px;border-radius:6px;font-size:13px}

.sheet.panel .small.syer{font-size:14px}
.sheet.panel .sform{align-items:flex-start;gap:10px}
.sheet.panel .sform input{width:260px;max-width:100%;height:38px;padding:0 10px;border:1px solid var(--line2);border-radius:8px;font-size:15px}

.ctx button:hover svg,.ctx button:focus-visible svg{color:inherit}

.ctx button.dan:hover,.ctx button.dan:focus-visible{background:var(--danger);color:var(--on)}
.ctx hr{width:calc(100% - 12px);margin:4px 6px;border:0;border-top:1px solid var(--line)}
.row.ctxon{background:var(--weak)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);transform:translateX(-50%);padding:10px 16px;border-radius:10px;background:var(--fg);color:var(--bg);font-size:14px;line-height:1.5;box-shadow:0 8px 24px var(--shadow)}
.toast button{flex:none;min-height:32px;padding:0 4px;border:0;background:transparent;color:var(--bg);font-size:14px;font-weight:700;text-decoration:underline}

/* iPhoneのSafariは、文字が16px未満の入力欄をタップすると画面を拡大し、そのまま戻らない。
   iPhone（指で操作し、画面の幅か高さが小さい端末）でだけ、入力欄の文字を16px以上にする（Kousei 1.39と同じ考え方）。iPadとMacは今のまま。
   メモの名前（.mt）のように、もとから16pxより大きい欄は、その大きさを保つ。本文と項目は、文字サイズの設定（小・標準・大）を生かしつつ16pxを下回らないようにする */
@media (pointer:coarse) and (max-width:700px),(pointer:coarse) and (max-height:500px){
  input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=range]):not([type=button]),select,textarea:not(.mt){font-size:16px!important}
  textarea.mb,.lview.mbv{font-size:max(16px, calc(var(--fs) - 1px + var(--dfs)))!important}
  [contenteditable]{font-size:max(16px, calc(var(--fs) + var(--dfs)))!important}
  .tx{padding:calc((var(--rh) - max(16px, calc(var(--fs) + var(--dfs))) * 1.5) / 2) 0}
}
/* ボタンの大きさは Kousei 1.39 とそろえる（Mac・iPad・iPhone 共通）
   文字のボタン：高さ30px・文字13px・左右14px・角6px。文字の上下の位置は調整しない
   アイコンだけのボタン：30px四方・角6px */
.btn,.seg button,.sb,.rbtn,.expand,.dash{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:30px;padding:0 14px;border-radius:6px;font-size:13px;line-height:1.6}
.sb{justify-content:flex-start;gap:10px;width:auto;max-width:100%;align-self:flex-start;text-align:left}
.sb .n{margin-left:4px;font-size:13px}
.rbtn{margin-right:6px}
.expand{min-width:0;margin-top:22px;border-width:1px}
.dash{margin-top:8px;border-width:1px;font-weight:400}
.chip{height:auto;min-height:30px;padding:0 8px 2px 12px;border-radius:6px;font-size:13px}
.ib{width:30px;height:30px;border-radius:6px}
.tb{border-radius:6px}
.tb button{height:30px;padding:0 8px 2px}
.sform .btn{align-self:auto}
/* 文字の欄も Kousei と同じ高さ38px・文字15px・角8px（iPhoneでは上の指定で16px） */
.newcat input,.crow input{height:38px;padding:0 10px;border-radius:8px;font-size:15px}
.newcat{align-items:center}
.newcat .go{display:inline-flex;width:38px;height:38px;flex:none;align-items:center;justify-content:center;padding:0;border:0;border-radius:8px;background:var(--fg);color:var(--on)}
.newcat .go:focus-visible{outline:2px solid var(--caret);outline-offset:2px}
/* ===== シリーズ共通の大きさの基準（Kousei 1.43 と同じ。1.23） =====
   高さ32：押すもの（文字のボタン、アイコンのボタン32×32、戻る、タブ、切り替え、追加ボタン、メニューの項目、1行の一覧の行）と入力欄
   文字：題名18・太字／ボタン・タブ・切り替え・メニュー・一覧・見出し（太字）・入力欄14／状態・件数・日付・説明文12
   ボタンの左右の余白12。アイコン：アイコンのボタンは16、文字のボタンの中は14
   角：外側の枠14／枠の中の枠・浮かぶ枠10／入力欄・追加ボタン・1行の一覧の行8／ボタン・切り替えの外枠6
   文字を1px上げる調整はしない（Noto Sans JP はもともと少し上に描かれるため）
   例外（今のまま）：メモの中身（名前・本文・項目と項目の行・印・開閉）、メモの一覧の行（指で操作する端末で大きくする）、
   2行の文字が入るものの高さ、枠が見えない部品（つまみ・下線の文字）、小さな記号（項目数の印・⌄・B I S）、アプリ名、
   iPhone のキーボードの上の道具、iPhone の上の帯（39）、iPhone のカテゴリのタブ（下線のタブ。高さと文字だけ基準） */
/* 文字のボタン */
.btn,.seg button,.sb,.rbtn,.expand,.dash,.chip,.sheet.panel .btn{min-height:32px;padding:0 12px;border-radius:6px;font-size:14px}
.chip{height:auto;padding:0 8px 0 12px}
.sb .n,.sheet .sb .n{font-size:14px}
.expand svg,.archlink svg,.architems svg,.ctx button svg,.back svg{width:14px;height:14px}
/* アイコンのボタン */
.ib{width:32px;height:32px;border-radius:6px}
.ib svg{width:16px;height:16px}
#bMenu svg{width:18px;height:18px}
/* 追加ボタン（↓↑）と入力欄 */
.qform input,.newcat input,.crow input,.sheet.panel .sform input,#mvnew{height:32px;padding:0 10px;border-radius:8px;font-size:14px}
.qform .go,.newcat .go{width:32px;height:32px;border-radius:8px}
.qform .go svg,.newcat .go svg{width:16px;height:16px}
.search{height:32px}
.search input{font-size:14px}
.copybox{font-size:14px}
/* 戻る・タブ・カテゴリの行・メニューの項目・1行の一覧の行 */
.back{min-height:32px;font-size:14px}
.tab{min-height:32px;font-size:14px}
.tab .n{font-size:12px}
.si{min-height:32px;padding-top:0;padding-bottom:0;font-size:14px}
.archlink{min-height:32px;padding:8px 8px 0;font-size:14px}
.architems{min-height:32px;font-size:14px}
.lnk{min-height:32px;font-size:14px}
#bSearchEnd{min-height:32px!important;font-size:14px!important;align-self:center;white-space:nowrap;flex:none}
.sbar .search{min-width:0}
.ctx{border-radius:10px}
.ctx button{min-height:32px;padding:0 12px;font-size:14px}
.pick button{min-height:32px;padding:0 6px;border-radius:8px;font-size:14px}
.pick button .n{font-size:12px}
/* 切り替え（Hongaki の形：1pxの枠で囲み、区切り線でつなぐ。選んだものは墨色、文字は白・ふつうの太さ） */
.seg,.sheet.panel .seg{display:inline-flex;flex-wrap:nowrap;align-self:flex-start;gap:0;height:32px;max-width:100%;border:1px solid var(--line2);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button,.sheet.panel .seg button{height:100%;min-height:0;min-width:0;padding:0 13px;border:0;border-left:1px solid var(--line2);border-radius:0;background:transparent;font-size:14px;font-weight:400;white-space:nowrap}
.seg button:first-child,.sheet.panel .seg button:first-child{border-left:0}
.seg button[aria-pressed="true"],.sheet.panel .seg button[aria-pressed="true"]{background:var(--fg);color:var(--on);font-weight:400}
.tb{height:32px;border-radius:6px}
.tb button{height:100%;padding:0 13px}
.tb button svg{width:16px;height:16px}
/* 2段の一覧（以前の版・項目を戻す）：1つの枠（角10）の中に区切り線で並べ、行ごとの角はなし */
.vlist,.alist{gap:0;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.vrow{border:0;border-top:1px solid var(--line);border-radius:0}
.vlist>.vrow:first-child{border-top:0}
.vrow:hover,.vrow.on{background:var(--sunken)}
.vlist .vprev{margin:0 12px 10px;border-radius:10px}
.vlist .btnrow{padding:0 12px 12px}
.arow{border:0;border-top:1px solid var(--line);border-radius:0}
.alist>.arow:first-child{border-top:0}
.arow:has(input:checked){background:var(--weak)}
.arow .at{font-size:14px}
.vrow .vt{font-size:14px}
/* 文字 */
.sheet h2,.sheet.panel h2{font-size:18px;font-weight:700;line-height:1.45}
.sheet h3,.sheet.panel h3{font-size:14px;font-weight:700;color:var(--fg)}
.ph{font-size:14px}
.sheet p,.sheet .small,.sheet.panel .small,.sheet.panel .small.who,.sheet.panel .small.syer,.sheet .msg,.empty,.mempty,.abanner{font-size:12px}
.sheet .foot,.sheet.panel .foot{font-size:12px}
.toast,.toast button{font-size:14px}
.vprev{font-size:14px}
.keys{font-size:12px!important}
.hidebar{font-size:12px}
/* 角の丸み */
.sheet,.sheet.panel{border-radius:14px}
.vprev{border-radius:10px}
/* 上の帯：Mac・iPad は55（32のボタン＋上下11）、iPhone は例外の39（32のボタン＋上下3） */
@media (min-width:760px){ #top{padding-block:11px} }

@media (pointer:coarse){ .si{min-height:32px;font-size:14px} .dash{min-height:32px} .archlink{min-height:32px} .btn{min-height:32px;font-size:14px} .rbtn{min-height:32px;font-size:14px} .qform input{height:32px;padding:0 10px;border-radius:8px} .qform .go{width:32px;height:32px;border-radius:8px} .ib{width:32px;height:32px;border-radius:6px} }
@media (max-width:759px){ .ib{width:32px;height:32px;border-radius:6px} }

      <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="5"/><path d="m13 13 3.5 3.5"/></svg>
      <span class="sr">すべてのメモを検索</span>
      <input id="q" type="search" placeholder="すべてのメモを検索" autocomplete="off">
    </label>

function reindex(m){ idx.clear(); if(!m) return; (function walk(p){ p.ch.forEach(function(c){ idx.set(c.id, { node:c, parent:p }); walk(c); }); })(m.root); }
function shown(c){ if(c.a) return false; var m=cur(); return !(m && m.hideDone && c.x); }
function visible(){ var out=[], m=cur(); if(!m) return out; (function walk(p){ p.ch.forEach(function(c){ if(!shown(c)) return; out.push(c.id); if(!c.c) walk(c); }); })(m.root); return out; }

function sortedMemos(){ return Array.from(S.memos.values()).sort(function(a,b){ return (a.order-b.order) || (b.created-a.created); }); }
function inCat(m, sel){

/* ---------- 保存：まずこの端末に、次にあなたのアカウントへ（Kousei・Hongakiと同じ仕組み） ----------
   手を止めて0.4秒後にこの端末（IndexedDB）へ保存し、その5秒後にアカウント（Firebase）へ送る。
   アカウントでは、メモ1件を1つの文書（users/あなたのUID/tebikae/メモのID）として持ち、カテゴリは「_meta」に入れる。 */
var DEV='d'+uid();
var M={ memos:{}, cats:{ base:0, dirty:false }, deleted:{}, uid:null };
function mmeta(id){ return M.memos[id] || (M.memos[id]={ base:0, dirty:false, seq:0 }); }
function nextRev(base){ return Math.max((base||0)+1, Date.now()); }
function DEVICE(){ var u=navigator.userAgent||''; if(/iPhone/.test(u)) return 'iPhone'; return navigator.maxTouchPoints>1 ? 'iPad' : 'Mac'; }
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function withTimeout(p, ms){
  return new Promise(function(res, rej){
    var t=setTimeout(function(){ rej({ code:'unavailable' }); }, ms||20000);
    p.then(function(v){ clearTimeout(t); res(v); }, function(e){ clearTimeout(t); rej(e); });
  });
}
/* 文書には中身をJSONの文字列（j）で入れる（Kousei・Hongakiと同じ形） */
function wrapDoc(d){
  return { id:d.id, data:function(){ var v=d.data(); if(!v) return v; if(typeof v.j==='string'){ try{ return JSON.parse(v.j); }catch(e){ return null; } } return v; } };
}
function fsAdapter(fs){
  return {
    doc:function(p){
      var ref=FB.doc(fs, p);
      return {
        set:function(o){ return withTimeout(FB.setDoc(ref, { j:JSON.stringify(o), rev:o.rev||0, dev:o.dev||'', t:Date.now() })); },
        delete:function(){ return withTimeout(FB.deleteDoc(ref)); }
      };
    },
    collection:function(p){
      var ref=FB.collection(fs, p);
      return {
        onSnapshot:function(next, err){
          return FB.onSnapshot(ref, function(sn){
            next({ docs:sn.docs.map(wrapDoc), docChanges:function(){ return sn.docChanges().map(function(c){ return { type:c.type, doc:wrapDoc(c.doc) }; }); } });
          }, err);
        }
      };
    }
  };
}
var Store={
  mode:'pending', db:null, base:null, ready:false, configured:false, auth:null, user:null, unsub:null, authKnown:false,
  signedOut:function(){ return this.configured && this.authKnown && !this.user; },
  init:function(){
    var cfg=window.TEBIKAE_FIREBASE||window.HONGAKI_FIREBASE||window.GENKO_FIREBASE||window.BUNPITU_FIREBASE;
    if(!window.FB || !cfg || !cfg.apiKey){ this.mode='local'; this.ready=true; this.authKnown=true; paintStatus(); return; }
    try{
      var app=FB.initializeApp(cfg);
      this.auth=FB.getAuth(app); this.fs=FB.getFirestore(app); this.configured=true;
    }catch(e){ this.mode='local'; this.ready=true; this.authKnown=true; paintStatus(); return; }
    FB.onAuthStateChanged(this.auth, function(u){ Store.onUser(u); });
  },
  onUser:function(u){
    this.authKnown=true;
    if(u && this.user && u.uid===this.user.uid) return;
    if(this.unsub){ try{ this.unsub(); }catch(e){} this.unsub=null; }
    Object.keys(timers).forEach(function(k){ cancelJob(k); });
    lastError=null;
    if(u){
      /* 前と違うアカウントでログインしたときは、この端末のメモをすべて新しいアカウントへ送り直す */
      if(M.uid && M.uid!==u.uid){
        Object.keys(M.memos).forEach(function(k){ M.memos[k].base=0; M.memos[k].dirty=true; });
        M.cats.base=0; M.cats.dirty=true; M.deleted={};
      }
      M.uid=u.uid;
      this.user=u; this.db=fsAdapter(this.fs); this.base='users/'+u.uid+'/tebikae';
      this.mode='db'; this.ready=false;
      persistLocalNow(); subscribe();
    } else {
      this.user=null; this.db=null; this.base=null;
      this.mode='local'; this.ready=true;

  retry:async function(fn){
    try{ return await fn(); }
    catch(e){ if(e && (e.code==='unavailable' || e.code==='deadline-exceeded' || !e.code)){ await sleep(400+Math.random()*500); return await fn(); } throw e; }
  }

/* ファイルの保存：iPhone・iPadは共有シートから「"ファイル"に保存」、Macはダウンロード */
function saveFile(name, data, type){
  var blob=data instanceof Blob ? data : new Blob([data], { type:type });
  return (async function(){
    if(navigator.maxTouchPoints>1 && navigator.canShare){
      try{
        var file=new File([blob], name, { type:blob.type||type });
        if(navigator.canShare({ files:[file] })){ await navigator.share({ files:[file] }); return { status:'saved' }; }
      }catch(e){ if(e && e.name==='AbortError') throw { code:'declined' }; }
    }
    var url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
    return { status:'saved' };
  })();
}
var dl={ save:function(o){ return saveFile(o.filename, o.data, 'application/json'); } };

var localTimer=null, localError=false, editPending=false;
var IDB={
  db:null,
  open:function(){
    return new Promise(function(res){
      try{
        var rq=indexedDB.open('tebikae', 1);
        rq.onupgradeneeded=function(){ rq.result.createObjectStore('kv'); };
        rq.onsuccess=function(){ IDB.db=rq.result; res(true); };
        rq.onerror=rq.onblocked=function(){ res(false); };

    });
  },
  get:function(k){
    return new Promise(function(res){
      try{ var q=IDB.db.transaction('kv','readonly').objectStore('kv').get(k); q.onsuccess=function(){ res(q.result); }; q.onerror=function(){ res(undefined); }; }
      catch(e){ res(undefined); }
    });
  },
  put:function(k, v){
    return new Promise(function(res, rej){
      try{ var tx=IDB.db.transaction('kv','readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete=function(){ res(); }; tx.onerror=tx.onabort=function(){ rej(tx.error); }; }
      catch(e){ rej(e); }
    });
  }
};
var LOCAL_KEY='tebikae-state';
function stateStr(){ return JSON.stringify({ v:1, cats:S.cats, memos:Array.from(S.memos.values()).map(function(m){ var d=serialize(m); d.id=m.id; return d; }), meta:M }); }
function persistLocalNow(){
  clearTimeout(localTimer); localTimer=null; editPending=false;
  if(S.mode==='loading') return;
  var str=stateStr();
  if(IDB.db){ IDB.put('state', str).then(function(){ if(localError){ localError=false; paintStatus(); } }, function(){ localError=true; paintStatus(); }); return; }
  try{ localStorage.setItem(LOCAL_KEY, str); localError=false; }catch(e){ localError=true; }
}
var LOCAL_DELAY=400, PUSH_DELAY=5400, RETRY_DELAY=20000;
function localSoon(){ clearTimeout(localTimer); localTimer=setTimeout(function(){ persistLocalNow(); paintStatus(); }, LOCAL_DELAY); }
async function loadLocal(){
  var str=null;
  if(await IDB.open()) str=await IDB.get('state');
  if(!str){ try{ str=localStorage.getItem(LOCAL_KEY); }catch(e){} }
  var d=null; try{ d=JSON.parse(str||'null'); }catch(e){}
  if(!d) return;
  S.cats=cleanCats(d.cats);
  (d.memos||[]).forEach(function(x){ if(x && typeof x.id==='string') S.memos.set(x.id, deserialize(x.id, x)); });
  var mt=d.meta||{};
  M.memos=mt.memos||{}; M.cats=mt.cats||{ base:0, dirty:false }; M.deleted=mt.deleted||{}; M.uid=mt.uid||null;
}
/* 配色・文字の大きさ・開いていたカテゴリは、この端末だけに覚える */
function pref(k, v){ try{ if(v===undefined) return localStorage.getItem('tebikae-'+k); localStorage.setItem('tebikae-'+k, v); }catch(e){ return null; } }
function cleanCats(a){ return (Array.isArray(a)?a:[]).filter(function(c){ return c && typeof c.id==='string'; }).map(function(c){ return { id:c.id, name:String(c.name||'') }; }); }

/* ---------- 送る順番 ---------- */
var timers={}, jobs={}, inflight=0, lastError=null;
function queue(key, fn, delay){
  if(timers[key]) clearTimeout(timers[key]);
  jobs[key]=fn;
  timers[key]=setTimeout(function(){ run(key); }, delay==null ? PUSH_DELAY : delay);
  paintStatus();
}
async function run(key){
  var fn=jobs[key];
  clearTimeout(timers[key]); delete timers[key]; delete jobs[key];
  if(!fn) return;
  inflight++; paintStatus();
  try{ await fn(); lastError=null; }
  catch(e){ lastError=e||{}; retrySoon(); }
  finally{ inflight--; paintStatus(); }
}
/* 送れなかったときは、20秒後に送り直す */
var retryTimer=null;
function retrySoon(){ if(retryTimer) return; retryTimer=setTimeout(function(){ retryTimer=null; syncDirty(); }, RETRY_DELAY); }
function flushAll(){ if(localTimer) persistLocalNow(); Object.keys(jobs).forEach(function(k){ run(k); }); }
function flush(){ flushAll(); return Promise.resolve(); }
function cancelJob(k){ if(timers[k]){ clearTimeout(timers[k]); delete timers[k]; } delete jobs[k]; }
function offline(){ return navigator.onLine===false; }

function markDirty(id){
  var x=mmeta(id); x.dirty=true; x.seq=(x.seq||0)+1;
  if(M.deleted[id]){ delete M.deleted[id]; cancelJob('del:'+id); }
  editPending=true; localSoon();
  if(Store.mode==='db') queue('m:'+id, function(){ return pushMemo(id); }); else paintStatus();
}
function touch(m){
  if(!m) return;
  m.updated=Date.now(); markDirty(m.id);
  if(m.id===S.cur) scheduleSnap();
  clearTimeout(listTimer); listTimer=setTimeout(function(){ renderSide(); renderTabs(); renderList(); }, 350);
}
function saveMeta(){
  M.cats.dirty=true; editPending=true; localSoon();
  if(Store.mode==='db') queue('cats', pushCats); else paintStatus();
}
function removeMemoDoc(id){
  cancelJob('m:'+id);
  var x=M.memos[id]; delete M.memos[id];
  if((x && x.base>0) || Store.user){ M.deleted[id]=true; if(Store.mode==='db') queue('del:'+id, function(){ return pushDelete(id); }, 0); }
  localSoon(); paintStatus();
}
async function pushMemo(id){
  if(Store.mode!=='db' || !Store.ready || offline()) return;
  if(S.held.has(id)) return;   /* 別の端末の版を受け取り待ちのメモは、書き終えてから比べる */
  var m=S.memos.get(id); if(!m) return;
  var x=mmeta(id), seq=x.seq, rev=nextRev(x.base), doc=serialize(m); doc.rev=rev; doc.dev=DEV;
  await Store.retry(function(){ return Store.db.doc(Store.base+'/'+id).set(doc); });
  x.base=rev; if(x.seq===seq && !S.held.has(id)) x.dirty=false;
  localSoon();
}
async function pushCats(){
  if(Store.mode!=='db' || !Store.ready || offline()) return;
  var rev=nextRev(M.cats.base), str=JSON.stringify(S.cats);
  await Store.retry(function(){ return Store.db.doc(Store.base+'/_meta').set({ app:'Tebikae', categories:JSON.parse(str), rev:rev, dev:DEV }); });
  M.cats.base=rev;
  if(JSON.stringify(S.cats)===str) M.cats.dirty=false;
  localSoon();
}
async function pushDelete(id){
  if(Store.mode!=='db' || !Store.ready || offline()) return;
  await Store.retry(function(){ return Store.db.doc(Store.base+'/'+id).delete(); });
  delete M.deleted[id]; localSoon();
}

function isEd(a){ return !!a && (a.tagName==='TEXTAREA' || a.isContentEditable); }
function editingCur(){ var a=document.activeElement; return isEd(a) && $('memoCol').contains(a); }

/* 別の端末から届いたメモ。この端末でも書き換えていたときは、届いた版を元のメモにし、
   この端末で書いた版は「（iPhoneで書いた版）」などの別のメモとして残す（Kousei・Hongakiと同じ） */
function applyRemoteMemo(id, v){
  var x=mmeta(id), rv=+v.rev||0, loc=S.memos.get(id);
  if(loc && rv<=(x.base||0)) return false;
  if(loc && id===S.cur && editingCur()){ S.held.set(id, v); return false; }
  S.held.delete(id);
  if(loc && x.dirty){
    verSave(loc, 'remote');
    var tag='（'+DEVICE()+'で書いた版）', cid=uid(), mine=deserialize(cid, serialize(loc));
    mine.title=(loc.title.trim()||'無題のメモ')+tag; mine.order=loc.order-0.5; mine.created=Date.now(); mine.updated=Date.now();
    S.memos.set(cid, mine); markDirty(cid);
    cancelJob('m:'+id);
    S.memos.set(id, deserialize(id, v)); x.base=rv; x.dirty=false; H.delete(id); localSoon();
    toast('別の端末で書き換えられた版を読み込みました。この端末で書いた分は「'+tag+'」として残しています', '見る', function(){ openMemo(cid); });
    return true;
  }
  if(loc){ verSave(loc, 'remote'); warnCut(loc, v); }
  S.memos.set(id, deserialize(id, v)); x.base=rv; x.dirty=false; H.delete(id); localSoon();
  return true;
}
/* 別の端末の変更で、メモの中身が大きく減ったときに知らせる */
function warnCut(loc, v){
  var a=memoText(loc).length, b=memoText(deserialize('x', v)).length;
  if(a>=200 && b<a*0.7) setTimeout(function(){ toast('別の端末の変更で「'+short(loc.title||'無題のメモ')+'」の中身が大きく減りました。誤りなら、メモの「以前の版」から戻せます', null, null, 9000); }, 400);
}
function removeRemoteMemo(id){
  if(M.deleted[id] || !S.memos.has(id)) return false;
  var x=mmeta(id);
  if(x.dirty){ x.base=0; queue('m:'+id, function(){ return pushMemo(id); }, 0); return false; }
  verSave(S.memos.get(id), 'deleted');
  S.memos.delete(id); delete M.memos[id]; H.delete(id); S.held.delete(id); localSoon();
  if(S.cur===id){ S.cur=null; S.view='list'; toast('このメモは別の端末で削除されました'); }
  return true;
}
function applyRemoteCats(v){
  var rv=+v.rev||0; if(rv<=(M.cats.base||0)) return false;
  var list=cleanCats(v.categories);
  if(M.cats.dirty){
    /* 両方で変えていたときは、この端末の並びを生かし、向こうにしかないカテゴリを後ろに足す */
    var have=new Set(S.cats.map(function(c){ return c.id; }));
    list.forEach(function(c){ if(!have.has(c.id)) S.cats.push(c); });
    M.cats.base=rv; queue('cats', pushCats, 1000);
  } else {
    var byId=new Map(S.cats.map(function(c){ return [c.id, c]; }));
    S.cats=list.map(function(c){ var o=byId.get(c.id); if(o){ o.name=c.name; return o; } return c; });
    M.cats.base=rv;
  }
  localSoon(); return true;
}
function handleRemote(type, d){
  if(d.id==='_meta'){
    if(type==='removed') return false;
    var cv=d.data(); if(!cv || cv.dev===DEV) return false;
    return applyRemoteCats(cv);
  }
  if(type==='removed') return removeRemoteMemo(d.id);
  var v=d.data(); if(!v || v.dev===DEV || M.deleted[d.id]) return false;
  return applyRemoteMemo(d.id, v);
}
function subscribe(){
  var myBase=Store.base;
  Store.unsub=Store.db.collection(Store.base).onSnapshot(function(snap){
    if(Store.mode!=='db' || Store.base!==myBase) return;
    var first=!Store.ready, changed=false;
    snap.docChanges().forEach(function(ch){ try{ if(handleRemote(ch.type, ch.doc)) changed=true; }catch(e){ lastError=e||{}; } });
    if(first){
      /* アカウントにないメモ：一度送ったことがあるものは別の端末で削除された。まだ送っていないものは送る */
      var ids={}; snap.docs.forEach(function(x){ ids[x.id]=true; });
      Array.from(S.memos.keys()).forEach(function(id){
        if(ids[id]) return;
        var x=mmeta(id);
        if(x.base>0 && !x.dirty){ verSave(S.memos.get(id), 'deleted'); S.memos.delete(id); delete M.memos[id]; H.delete(id); changed=true; }
        else x.dirty=true;
      });
      if(!ids['_meta'] && S.cats.length) M.cats.dirty=true;
      Store.ready=true; localSoon(); syncDirty();
    }
    if(changed || first) renderKeep();
    paintStatus();
  }, function(err){ lastError=err||{ code:'unavailable' }; paintStatus(); });
}
/* 書いている途中の欄を保ったまま描き直す */
function renderKeep(){
  if(S.cur && !S.memos.has(S.cur)){ S.cur=null; S.view='list'; }
  if(editingCur()){ renderSide(); renderTabs(); renderList(); return; }
  render();
}
function anyDirty(){
  return Object.keys(M.memos).some(function(k){ return M.memos[k].dirty && S.memos.has(k); }) || !!M.cats.dirty || Object.keys(M.deleted).length>0;
}
function syncDirty(){
  if(Store.mode!=='db' || !Store.ready) return;
  Object.keys(M.deleted).forEach(function(id){ queue('del:'+id, function(){ return pushDelete(id); }, 0); });
  Object.keys(M.memos).forEach(function(id){ if(M.memos[id].dirty && S.memos.has(id)) queue('m:'+id, function(){ return pushMemo(id); }, 0); });
  if(M.cats.dirty) queue('cats', pushCats, 0);
}
window.addEventListener('online', function(){ lastError=null; paintStatus(); setTimeout(syncDirty, 500); });
window.addEventListener('offline', function(){ paintStatus(); });

/* 状態の表示（Kousei・Hongakiと同じ文言） */
function statusInfo(){
  var waiting=Store.mode==='db' && anyDirty();
  if(localError) return { text:'端末に保存できません', err:true };
  if(S.mode==='loading') return { text:'読み込み中…', err:false };
  if(editPending) return { text:'保存中…', err:false };
  if(Store.mode==='pending') return { text:'端末に保存済み', err:false };
  if(Store.mode!=='db') return { text:Store.signedOut() ? '端末に保存済み・未ログイン' : '端末に保存済み（同期なし）', err:false };
  if(offline()) return { text:waiting ? '端末に保存済み・同期待ち（オフライン）' : '端末に保存済み（オフライン）', err:false };
  if(!Store.ready) return lastError ? { text:'同期に失敗（再試行します）', err:true } : { text:'最新の版を確認中…', err:false };
  if(lastError) return { text:'同期に失敗（再試行します）', err:true };
  if(inflight>0) return { text:'同期中…', err:false };
  if(waiting) return { text:'端末に保存済み・同期待ち', err:false };
  return { text:'同期済み', err:false };
}
function errorText(e){
  if(!e) return '';
  if(e.code==='permission-denied') return 'このアカウントでは同期できません（この端末には保存済み）。Firestoreのルールを確かめてください。';
  if(e.code==='resource-exhausted') return '本日の同期の上限に達しました（この端末には保存済み）。';
  if(e.code==='invalid-argument') return 'メモが大きすぎて同期できませんでした。いくつかのメモに分けてください。';
  return '同期できませんでした（この端末には保存済み）。少しあとで、もう一度送ります。';
}
var lastErrToast=0, wasErr=false;
function paintStatus(){
  var i=statusInfo(), s=$('status');
  if(s){ s.textContent=i.text; s.classList.toggle('bad', i.err); }
  if(i.err && !wasErr && NARROW.matches && Date.now()-lastErrToast>60000){ lastErrToast=Date.now(); toast(i.text); }
  wasErr=i.err;
  if(syncDraw) syncDraw(true);
}

/* ---------- 以前の版（この端末の中だけに残す。Kousei・Hongakiと同じ仕組み） ----------
   メモを開いたとき・別の端末の変更を受け取る前・書いている途中（30分ごと）・削除する前などに、メモ全体を自動で残す。
   残すのは直近の5件と、それより前は30日分を1日1件 */
var VER_KEEP=5, VER_DAYS=30, VER_EVERY=30*60*1000;
var VER_WHY={ open:'開いたとき', remote:'別の端末の変更を受け取る前', auto:'書いている途中', deleted:'別の端末で削除される前', removed:'削除する前', before:'以前の版に戻す前' };
var vdb=null, verLast={};
function verOpen(){
  if(vdb) return Promise.resolve(vdb);
  return new Promise(function(res, rej){
    var r; try{ r=indexedDB.open('tebikae-history', 1); }catch(e){ rej(e); return; }
    r.onupgradeneeded=function(){ var st=r.result.createObjectStore('snaps', { keyPath:'k', autoIncrement:true }); st.createIndex('doc', 'doc'); };

function vtx(rw, fn){
  return verOpen().then(function(db){ return new Promise(function(res, rej){
    var t=db.transaction('snaps', rw), req=fn(t.objectStore('snaps')), out;
    if(req) req.onsuccess=function(){ out=req.result; };
    t.oncomplete=function(){ res(out); }; t.onerror=function(){ rej(t.error); }; t.onabort=function(){ rej(t.error); };
  }); });
}
function verOf(id){ return vtx('readonly', function(s){ return s.index('doc').getAll(id); }).then(function(a){ return (a||[]).sort(function(x, y){ return y.at-x.at; }); }); }
function verHash(str){ var h=2166136261; for(var i=0; i<str.length; i++){ h^=str.charCodeAt(i); h=Math.imul(h, 16777619); } return (h>>>0).toString(36)+':'+str.length; }
function isBlank(m){ return !m.title.trim() && !m.body.trim() && !m.root.ch.length; }
async function verSave(m, why){
  if(!m || isBlank(m)) return;
  try{
    var d=serialize(m), body=JSON.stringify(d), h=verHash(JSON.stringify({ t:d.title, b:d.body, i:d.items })), id=m.id;
    var list=await verOf(id);
    if(list[0] && list[0].h===h) return;   /* 直前の版と同じ中身なら残さない */
    await vtx('readwrite', function(s){ return s.add({ doc:id, at:Date.now(), why:why, dev:DEVICE(), h:h, title:m.title||'', body:body, n:countItems(m.root), chars:memoText(m).replace(/\s/g,'').length }); });
    await verPrune(id);
  }catch(e){}
}
function dayKey(t){ var d=new Date(t); return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); }
async function verPrune(id){
  var list=await verOf(id), now=Date.now(), keep={}, days={};
  list.forEach(function(x, i){
    if(i<VER_KEEP){ keep[x.k]=true; return; }
    if(now-x.at>VER_DAYS*864e5) return;
    var dk=dayKey(x.at); if(!days[dk]){ days[dk]=true; keep[x.k]=true; }
  });
  var del=list.filter(function(x){ return !keep[x.k]; });
  if(del.length) await vtx('readwrite', function(s){ del.forEach(function(x){ s.delete(x.k); }); });
}
/* 削除されたメモの版は、30日たったら消す */
async function verCleanup(){

    var all=await vtx('readonly', function(s){ return s.getAll(); }), now=Date.now();
    var del=(all||[]).filter(function(x){ return !S.memos.has(x.doc) && now-x.at>VER_DAYS*864e5; });
    if(del.length) await vtx('readwrite', function(s){ del.forEach(function(x){ s.delete(x.k); }); });
  }catch(e){}
}
function verMark(id){ verLast[id]={ at:Date.now(), seq:(M.memos[id]||{}).seq||0 }; }
setInterval(function(){
  var m=cur(); if(!m) return;
  var l=verLast[m.id]||{ at:0, seq:-1 };
  if(Date.now()-l.at<VER_EVERY || ((M.memos[m.id]||{}).seq||0)===l.seq) return;
  verMark(m.id); verSave(m, 'auto');
}, 60*1000);
function verWhen(t){

  var today=dayKey(Date.now()), yest=dayKey(Date.now()-864e5);

var syncDraw=null, syncBusy=false;
function authError(e){
  var c=e && e.code || '';

/* ログイン欄はフォームにしない。フォームにすると、Safariがパスワードの自動入力のあとにログインまで済ませてしまうため（Hongakiと同じ作り）。
   パスワード欄のEnterキーでもログインさせない。自動入力がEnterを送ってすぐログインしてしまい、違うアカウントを選んだときに欄のメールアドレスを確かめられないため */
function syncSection(s){

    if(!box.isConnected){ syncDraw=null; return; }
    var st=Store.configured ? (Store.authKnown ? (Store.user ? 'in' : 'out') : 'wait') : 'none';

    if(st==='in'){
      box.append(el('p','small who','ログイン中：'+(Store.user.email||'')));

      var er2=el('p','small syer'); var t2=(Store.ready && lastError) ? errorText(lastError) : ''; er2.textContent=t2; er2.hidden=!t2; box.append(er2);
      var out=btn('ログアウト','', signOutNow); out.disabled=syncBusy; var ob=el('div','pbtns'); ob.append(out); box.append(ob);
      return;
    }
    box.append(el('p','small','Hongaki・Kouseiと同じメールアドレスとパスワードでログインすると、iPhone・iPad・Macの間でメモを同期できます。ログインしなくても、この端末には保存されます。'));
    box.append(el('p','small syst','今の状態：'+statusInfo().text));
    var f=el('div','sform');
    var mail=document.createElement('input'); mail.type='email'; mail.id='si-mail'; mail.autocomplete='username'; mail.placeholder='メールアドレス'; mail.setAttribute('aria-label','メールアドレス'); mail.value=mv; mail.autocapitalize='off'; mail.spellcheck=false;

function signInNow(){

  while((node=w.nextNode())){ var L=node.nodeValue.length; if(acc+L>=target){ range.setStart(node, target-acc); done=true; break; } acc+=L; }
  if(!done){ range.selectNodeContents(e); range.collapse(false); } else range.collapse(true);
  var s=window.getSelection(); s.removeAllRanges(); s.addRange(range);
}
var mirror=el('div'); mirror.setAttribute('aria-hidden','true');

  var cs=getComputedStyle(ta);
  ['fontFamily','fontSize','fontWeight','lineHeight','letterSpacing','paddingLeft','paddingRight','paddingTop'].forEach(function(k){ mirror.style[k]=cs[k]; });
  mirror.style.width=ta.offsetWidth+'px'; mirror.style.boxSizing='border-box';
  mirror.textContent=ta.value.slice(0,pos); var sp=el('span',null,'​'); mirror.append(sp); return sp.offsetTop;

function lineH(e){ return parseFloat(getComputedStyle(e).lineHeight)||20; }
function ceLine(e, first){
  var r=selIn(e); if(!r || !r.collapsed) return false;
  if(!e.textContent) return true;
  var rect=r.getClientRects()[0];
  if(!rect){ var c=getCaret(e); return first ? c===0 : c===e.textContent.length; }
  var cs=getComputedStyle(e), er=e.getBoundingClientRect(), lh=lineH(e);
  if(first) return rect.top-(er.top+(parseFloat(cs.paddingTop)||0)) < lh/2;
  return (er.bottom-(parseFloat(cs.paddingBottom)||0))-rect.bottom < lh/2;
}

function onLastLine(e){ if(e.isContentEditable) return ceLine(e,false); if(e.selectionStart!==e.selectionEnd) return false; return caretTop(e,e.value.length)-caretTop(e,e.selectionStart) < lineH(e)/2; }

/* ---------- 戻す・やり直す ---------- */

function hist(m){ var h=H.get(m.id); if(!h){ h={ st:[stateOf(m)], pos:0 }; H.set(m.id, h); } return h; }
function snapNow(){
  clearTimeout(snapTimer); snapPending=false;
  var m=cur(); if(!m){ updUR(); return; }
  var h=hist(m), st=stateOf(m);
  if(h.st[h.pos]!==st){ h.st.splice(h.pos+1); h.st.push(st); if(h.st.length>200) h.st.shift(); h.pos=h.st.length-1; }
  updUR();
}
function scheduleSnap(){ clearTimeout(snapTimer); snapPending=true; snapTimer=setTimeout(snapNow, 700); updUR(); }
function updUR(){ var m=cur(), h=m && H.get(m.id); $('bUndo').disabled=!h || (h.pos<=0 && !snapPending); $('bRedo').disabled=!h || snapPending || h.pos>=h.st.length-1; }
function applyState(m, st){
  var d=JSON.parse(st), f=curFocus();
  var n=deserialize(m.id, { title:d.title, body:d.body, cat:d.cat, hideDone:d.hideDone, archived:d.archived, items:d.items, created:m.created });
  m.title=n.title; m.body=n.body; m.cat=n.cat; m.hideDone=n.hideDone; m.archived=n.archived; m.root=n.root;
  m.updated=Date.now(); markDirty(m.id);

}
function undo(){ var m=cur(); if(!m) return; snapNow(); var h=hist(m); if(h.pos<=0) return; h.pos--; applyState(m, h.st[h.pos]); }
function redo(){ var m=cur(); if(!m) return; snapNow(); var h=hist(m); if(h.pos>=h.st.length-1) return; h.pos++; applyState(m, h.st[h.pos]); }

/* ---------- 項目の操作 ---------- */
function commit(){ var m=cur(); reindex(m); renderMemo(); touch(m); snapNow(); }
function op(kind, id){
  if(!id || !idx.has(id)) return;
  var f=curFocus() || S.last;
  var x=idx.get(id), node=x.node, parent=x.parent, i=parent.ch.indexOf(node), j, m=cur();
  if(kind==='indent'){ j=i-1; while(j>=0 && !shown(parent.ch[j])) j--; if(j<0) return; var prev=parent.ch[j]; parent.ch.splice(i,1); prev.ch.push(node); prev.c=false; }
  else if(kind==='outdent'){ if(parent===m.root) return; var gp=idx.get(parent.id).parent; parent.ch.splice(i,1); gp.ch.splice(gp.ch.indexOf(parent)+1, 0, node); }
  else if(kind==='up'){ j=i-1; while(j>=0 && !shown(parent.ch[j])) j--; if(j<0) return; parent.ch.splice(i,1); parent.ch.splice(j,0,node); }
  else if(kind==='down'){ j=i+1; while(j<parent.ch.length && !shown(parent.ch[j])) j++; if(j>=parent.ch.length) return; parent.ch.splice(i,1); parent.ch.splice(j,0,node); }
  commit();
  restore(f && f.id===id ? f : { id:id, pos:null, f:'tx' });
}
function toggle(id){
  var x=idx.get(id); if(!x || !x.node.ch.filter(shown).length) return;
  var f=curFocus(); x.node.c=!x.node.c; commit();
  if(f && (f.f!=='tx' || isVisible(f.id))) restore(f); else focusItem(id, null);
}
function focusNeighbor(v, i){
  var after=visible(), f=null, k;
  for(k=i+1;k<v.length && !f;k++) if(after.indexOf(v[k])>=0) f=v[k];
  for(k=i-1;k>=0 && !f;k--) if(after.indexOf(v[k])>=0) f=v[k];
  if(f) focusItem(f, null); else upToBody();
}
function toggleStrike(id){
  var x=idx.get(id), m=cur(); if(!x) return;
  if(m.hideDone && !x.node.x){ var v=visible(), i=v.indexOf(id); x.node.x=true; commit(); focusNeighbor(v, i); toast('打ち消し線を引いて、隠しました'); return; }
  x.node.x=!x.node.x;
  var tx=$('t-'+id); if(tx) tx.closest('.row2').classList.toggle('done', x.node.x);
  touch(m); snapNow();
}
function fmt(cmd){ var a=document.activeElement; if(!a || !a.isContentEditable) return; try{ document.execCommand('styleWithCSS', false, false); }catch(e){} document.execCommand(cmd, false, null); }
function syncItem(e, node){ if(!e.textContent && e.innerHTML) e.innerHTML=''; node.h=cleanFrom(e); node.t=e.textContent; }
function addFirst(){ var m=cur(); if(!m) return; var nn=mkNode(''); m.root.ch.unshift(nn); commit(); focusItem(nn.id, 0); }
function splitEnter(id, e){
  var x=idx.get(id), node=x.node, parent=x.parent;
  syncItem(e, node);
  if(!node.t && !node.ch.length && parent!==cur().root){ op('outdent', id); return; }
  var r=selIn(e), bH=node.h, aH='', bT=node.t, aT='';
  if(r){
    var a=document.createRange(); a.selectNodeContents(e); a.setEnd(r.startContainer, r.startOffset);
    var b=document.createRange(); b.selectNodeContents(e); b.setStart(r.endContainer, r.endOffset);
    var fa=document.createElement('div'); fa.append(a.cloneContents());
    var fb=document.createElement('div'); fb.append(b.cloneContents());
    bH=cleanFrom(fa); aH=cleanFrom(fb); bT=fa.textContent; aT=fb.textContent;
  }
  if(!bT && node.t.length && r && r.collapsed){ parent.ch.splice(parent.ch.indexOf(node), 0, mkNode('')); commit(); focusItem(id, 0); return; }
  node.h=bH; node.t=bT;
  var nn=mkNode(''); nn.h=aH; nn.t=aT;
  if(node.ch.filter(shown).length && !node.c) node.ch.unshift(nn); else parent.ch.splice(parent.ch.indexOf(node)+1, 0, nn);
  commit(); focusItem(nn.id, 0);

function backspace(ev, id){
  var x=idx.get(id), node=x.node, parent=x.parent, v=visible(), i=v.indexOf(id), prevId=i>0?v[i-1]:null;
  if(node.t==='' && !node.ch.length){
    ev.preventDefault(); parent.ch.splice(parent.ch.indexOf(node),1); commit();
    if(prevId) focusItem(prevId, null); else upToBody(); return;
  }
  if(!node.ch.length && prevId){
    ev.preventDefault();
    var prev=idx.get(prevId).node, L=prev.t.length;
    prev.h=tidy(prev.h+node.h); prev.t+=node.t;
    parent.ch.splice(parent.ch.indexOf(node),1); commit(); focusItem(prevId, L);
  }
}
function deleteItem(id){
  var m=cur(), x=idx.get(id); if(!m || !x) return;
  var v=visible(), i=v.indexOf(id), pid=x.parent.id, at=x.parent.ch.indexOf(x.node), node=x.node, mid=m.id, kids=countAll(node)-1;
  x.parent.ch.splice(at,1); commit(); focusNeighbor(v, i);
  toast('「'+short(node.t)+'」'+(kids?'と子の項目'+kids+'件':'')+'を削除しました', '元に戻す', function(){
    var mm=cur(); if(!mm || mm.id!==mid) return; reindex(mm);
    var par=(pid && idx.get(pid)) ? idx.get(pid).node : mm.root; par.ch.splice(Math.min(at, par.ch.length), 0, node); commit();
  });
}

  node.a=true; commit(); focusNeighbor(v, i);
  toast('「'+short(node.t)+'」をアーカイブしました', '元に戻す', function(){ var mm=cur(); if(!mm || mm.id!==mid) return; node.a=false; commit(); });

function itemKey(e, tx, id){
  if(e.isComposing || e.keyCode===229) return;
  var mod=e.metaKey||e.ctrlKey, k=e.key, v, i;
  if(mod && (k==='b'||k==='B')){ e.preventDefault(); fmt('bold'); return; }
  if(mod && (k==='i'||k==='I')){ e.preventDefault(); fmt('italic'); return; }
  if(mod && (k==='u'||k==='U')){ e.preventDefault(); return; }
  if(mod && e.shiftKey && (k==='Backspace'||k==='Delete')){ e.preventDefault(); deleteItem(id); return; }
  if(k==='Enter'){ e.preventDefault(); if(mod) toggleStrike(id); else splitEnter(id, tx); return; }
  if(k==='Tab'){ e.preventDefault(); op(e.shiftKey?'outdent':'indent', id); return; }
  if(mod && k==='ArrowUp'){ e.preventDefault(); op('up', id); return; }
  if(mod && k==='ArrowDown'){ e.preventDefault(); op('down', id); return; }
  if(mod && k==='.'){ e.preventDefault(); toggle(id); return; }
  if(k==='Backspace' && collapsed(tx) && getCaret(tx)===0){ backspace(e, id); return; }
  if(k==='ArrowUp' && !e.shiftKey && !e.altKey && onFirstLine(tx)){
    v=visible(); i=v.indexOf(id); e.preventDefault();
    if(i>0) focusItem(v[i-1], Math.min(getCaret(tx), idx.get(v[i-1]).node.t.length)); else upToBody();
    return;
  }
  if(k==='ArrowDown' && !e.shiftKey && !e.altKey && onLastLine(tx)){
    v=visible(); i=v.indexOf(id);
    if(i<v.length-1){ e.preventDefault(); focusItem(v[i+1], Math.min(getCaret(tx), idx.get(v[i+1]).node.t.length)); }
  }
}

  if(v){ mscroll.scrollTop+=v; itemDragStep(); idrag.raf=requestAnimationFrame(itemAutoScroll); }

function itemDragStep(){
  var d=idrag, g=$('ghost'), line=$('dropline');
  g.style.transform='translate('+(d.x+14)+'px,'+(d.y-44)+'px)';
  var rows=Array.prototype.filter.call(outline.querySelectorAll('.row2'), function(r){ return !d.it.contains(r); });
  d.target=null; d.mode=null; line.hidden=true; if(!rows.length) return;
  var hit=null, i, r, mode;
  for(i=0;i<rows.length;i++){ r=rows[i].getBoundingClientRect(); if(d.y<r.bottom){ hit=rows[i]; break; } }
  if(!hit){ hit=rows[rows.length-1]; mode='after'; }
  else {
    r=hit.getBoundingClientRect();
    if(d.y<r.top+r.height/2) mode='before';
    else {
      var hn=idx.get(hit.closest('.item').dataset.id).node, tl=hit.querySelector('.tx').getBoundingClientRect().left;
      mode=((hn.ch.filter(shown).length && !hn.c) || d.x>tl+28) ? 'child' : 'after';
    }

  r=hit.getBoundingClientRect();
  var cr=mcol.getBoundingClientRect(), txr=hit.querySelector('.tx').getBoundingClientRect();
  var left = mode==='child' ? txr.left : r.left+4;
  var top = mode==='before' ? r.top-cr.top-1 : mode==='child' ? r.bottom-cr.top-1 : hit.closest('.item').getBoundingClientRect().bottom-cr.top-1;
  line.style.left=(left-cr.left)+'px'; line.style.width=Math.max(40, cr.right-left)+'px'; line.style.top=top+'px'; line.hidden=false;
  d.target=hit.closest('.item').dataset.id; d.mode=mode;
}

function reorderMemo(id, tid, pos){
  var group=viewList(), n=S.memos.get(id), t=S.memos.get(tid);
  if(!n || !t || id===tid) return;
  var slots=group.map(function(m){ return m.order; }).sort(function(a,b){ return a-b; });
  if(new Set(slots).size!==slots.length){ var base=slots[0]; slots=group.map(function(m, k){ return base+k; }); }
  var seq=group.filter(function(m){ return m!==n; }), ti=seq.indexOf(t);
  seq.splice(pos==='before' ? ti : ti+1, 0, n);

}

  if(i<0 || j<0 || j>=list.length) return;

function memoDragStep(){
  var d=mdrag, dy=d.y-d.y0+(rowsEl.scrollTop-d.sc0);
  d.r.style.transform='translateY('+dy+'px)';

  var cy=d.mid[d.from]+dy, to=d.from, i;
  for(i=d.from+1; i<d.rows.length; i++) if(d.mid[i]<cy) to=i;

    list.addEventListener('pointerdown', function(e){
      var g=e.target.closest('.grip'); if(!g || cdrag) return; e.preventDefault();
      var r=g.closest('.crow'); cdrag={ id:g.dataset.id, r:r, pid:e.pointerId, y0:e.clientY, y:e.clientY, target:null, pos:null };
      try{ g.setPointerCapture(e.pointerId); }catch(x){} r.classList.add('dragging'); document.body.classList.add('nosel');
    });
    list.addEventListener('pointermove', function(e){
      if(!cdrag || e.pointerId!==cdrag.pid) return; e.preventDefault(); cdrag.y=e.clientY;
      cdrag.r.style.transform='translateY('+(cdrag.y-cdrag.y0)+'px)';
      var rs=Array.prototype.filter.call(list.querySelectorAll('.crow'), function(x){ return x!==cdrag.r; });
      rs.forEach(function(x){ x.classList.remove('db','da'); }); cdrag.target=null;
      for(var i=0;i<rs.length;i++){ var b=rs[i].getBoundingClientRect(); if(cdrag.y<b.top+b.height/2){ cdrag.target=rs[i].dataset.id; cdrag.pos='before'; rs[i].classList.add('db'); return; } }
      if(rs.length){ cdrag.target=rs[rs.length-1].dataset.id; cdrag.pos='after'; rs[rs.length-1].classList.add('da'); }
    });
    function endC(apply){
      var d=cdrag; cdrag=null; if(!d) return; document.body.classList.remove('nosel');
      if(apply && d.target && Math.abs(d.y-d.y0)>4){
        var c=S.cats.find(function(x){ return x.id===d.id; }); S.cats=S.cats.filter(function(x){ return x.id!==d.id; });
        var ti=S.cats.findIndex(function(x){ return x.id===d.target; }); S.cats.splice(d.pos==='before'?ti:ti+1, 0, c); saveMeta(); renderSide(); renderTabs();
      }
      draw();
    }
    list.addEventListener('pointerup', function(e){ if(cdrag && e.pointerId===cdrag.pid) endC(true); });
    list.addEventListener('pointercancel', function(e){ if(cdrag && e.pointerId===cdrag.pid) endC(false); });
    var nc=el('form','newcat'), inp=document.createElement('input'); inp.type='text'; inp.placeholder='新しいカテゴリの名前'; inp.setAttribute('aria-label','新しいカテゴリの名前'); inp.id='newcat';
    /* 追加のボタンは、メモを書く欄の「↓」と同じ形。カテゴリは上の一覧に入るので「↑」 */
    var go=el('button','go'); go.type='submit'; go.setAttribute('aria-label','カテゴリを追加'); go.title='追加';
    go.innerHTML='<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 15.5v-11M5 9.5l5-5 5 5"/></svg>';
    nc.append(inp, go);
    nc.addEventListener('submit', function(e){ e.preventDefault(); var v=inp.value.trim(); if(!v){ inp.focus(); return; } addCategory(v); inp.value=''; draw(); renderSide(); renderTabs(); inp.focus(); });
    s.append(nc);
    var cr=el('div','btnrow'); cr.append(btn('閉じる','', back || closeSheet)); s.append(cr);
    if(focusNew) setTimeout(function(){ inp.focus(); }, 60);
  });
}
function confirmDelCat(c, back){
  var n=0; S.memos.forEach(function(m){ if(m.cat===c.id) n++; });
  openSheet(function(s){
    s.append(el('h2',null,'「'+(c.name||'無題のカテゴリ')+'」を削除しますか？'));
    s.append(el('p',null, n ? 'このカテゴリのメモ'+n+'件は、未分類に移ります。メモは消えません。' : 'このカテゴリにメモはありません。'));
    var r=el('div','btnrow');
    r.append(btn('やめる','', function(){ openCatEditor(false, back); }), btn('削除する','pri', function(){
      S.cats=S.cats.filter(function(x){ return x.id!==c.id; });
      S.memos.forEach(function(m){ if(m.cat===c.id){ m.cat=''; touch(m); } });
      if(S.sel===c.id) S.sel='inbox';
      saveMeta(); render(); openCatEditor(false, back);
    }));
    s.append(r);
  });
}

function openItemSheet(id){
  var x=idx.get(id); if(!x) return; var kids=countAll(x.node)-1;
  openSheet(function(s){
    s.append(el('h2',null,'「'+short(x.node.t)+'」'));
    s.append(sb('アーカイブする', '', function(){ closeSheet(); archiveItem(id); }));
    s.append(sb(kids ? '子の項目ごと削除する（'+(kids+1)+'件）' : '削除する', 'dan', function(){ closeSheet(); deleteItem(id); }));
    s.append(el('p',null,'アーカイブした項目は、子の項目ごと見えなくなります。メモの一番下の「アーカイブした項目」から戻せます。'));
    closeRow(s);
  });
}
function openArchItems(){
  var m=cur(); if(!m) return; var list=[];
  (function walk(p, path){ p.ch.forEach(function(c){ if(c.a) list.push({ node:c, path:path, kids:countAll(c)-1 }); else walk(c, path.concat(c.t.trim()||'無題')); }); })(m.root, []);
  if(!list.length) return;
  openSheet(function(s){
    s.append(el('h2',null,'アーカイブした項目（'+list.length+'件）'));
    s.append(el('p',null,'メモに戻す項目を選んでください。子の項目も一緒に戻ります。'));
    var box=el('div','alist'), go;
    function sync(){ var k=box.querySelectorAll('input:checked').length; go.disabled=!k; go.textContent=k?'選んだ'+k+'件を戻す':'選んだ項目を戻す'; }
    list.forEach(function(a){
      var lb=el('label','arow'), cb=document.createElement('input'); cb.type='checkbox'; cb.value=a.node.id; cb.id='ar-'+a.node.id; cb.addEventListener('change', sync);
      var tx=el('span'); tx.append(el('span','at', a.node.t.trim()||'無題'), el('span','ap', (a.path.length ? a.path.join(' › ') : 'メモの一番上の階層')+(a.kids?'　子の項目'+a.kids+'件':''))); lb.append(cb, tx); box.append(lb);
    });
    s.append(box);
    var r=el('div','btnrow');
    go=btn('選んだ項目を戻す','pri', function(){
      var ids=Array.prototype.map.call(box.querySelectorAll('input:checked'), function(c){ return c.value; });
      closeSheet(); var nodes=ids.map(function(i){ return idx.get(i); }).filter(Boolean).map(function(x){ return x.node; });
      nodes.forEach(function(n){ n.a=false; }); commit(); toast(nodes.length+'件をメモに戻しました');
    });
    r.append(btn('閉じる','', closeSheet), go); s.append(r); sync();
  });
}
$('bMenu').addEventListener('click', function(){
  var m=cur(); if(!m) return; var hasItems=countItems(m.root)>0;
  openSheet(function(s){
    s.append(el('h2',null, m.title.trim()||'無題のメモ'));
    var msg=el('p','msg'); msg.setAttribute('aria-live','polite');
    s.append(sb('カテゴリを移す', '', function(){ openMovePicker(m.id); }, catName(memoCat(m))));
    if(hasItems){
      s.append(sb('すべて開く', '', function(){ closeSheet(); setAll(false); }));
      s.append(sb('すべて閉じる', '', function(){ closeSheet(); setAll(true); }));
      s.append(sb(m.hideDone?'打ち消し線の項目を表示する':'打ち消し線の項目を隠す', '', function(){ closeSheet(); m.hideDone=!m.hideDone; commit(); }));
    }
    s.append(sb('テキストとしてコピー', '', function(){ copyText(m, msg); }));
    s.append(sb('メモを複製', '', function(){ closeSheet(); duplicate(m); }));
    s.append(sb('以前の版', '', function(){ openVersions(m.id); }));
    s.append(sb(m.archived?'アーカイブから一覧に戻す':'メモをアーカイブ', '', function(){ closeSheet(); archiveMemo(m); }));
    s.append(sb('メモを削除', 'dan', function(){ confirmDelMemo(m); }));
    s.append(msg); closeRow(s);
  });
});
function setAll(collapse){ var m=cur(); (function walk(p){ p.ch.forEach(function(c){ if(c.ch.length) c.c=collapse; walk(c); }); })(m.root); commit(); }
function cloneTree(p){ return p.ch.map(function(c){ return { id:uid(), t:c.t, h:c.h, c:c.c, x:c.x, a:c.a, ch:cloneTree(c) }; }); }
function duplicate(m){
  var n=newMemo((m.title.trim()||'無題のメモ')+'のコピー', m.cat); n.order=m.order-0.5; n.body=m.body; n.hideDone=m.hideDone; n.root={ id:'', ch:cloneTree(m.root) };
  S.memos.set(n.id, n); touch(n); openMemo(n.id); toast('複製しました');
}
function archiveMemo(m){
  var was=m.archived; m.archived=!was; touch(m); if(m.id===S.cur) snapNow();
  if(!was){ flush(); if(m.id===S.cur){ S.cur=null; S.view='list'; } render(); toast('「'+short(m.title||'無題のメモ')+'」をアーカイブしました', '元に戻す', function(){ m.archived=false; touch(m); render(); }); }
  else { render(); toast('「'+short(m.title||'無題のメモ')+'」を一覧に戻しました', '元に戻す', function(){ m.archived=true; touch(m); render(); }); }
}
function deleteMemoNow(m){
  var copy=serialize(m), id=m.id;
  verSave(m, 'removed');
  S.memos.delete(id); H.delete(id); removeMemoDoc(id);
  if(S.cur===id){ S.cur=null; S.view='list'; }
  render();
  toast('「'+short(m.title||'無題のメモ')+'」を削除しました', '元に戻す', function(){ var n=deserialize(id, copy); S.memos.set(id, n); touch(n); render(); });
}
function confirmDelMemo(m){
  openSheet(function(s){
    s.append(el('h2',null,'「'+short(m.title||'無題のメモ')+'」を削除しますか？'));
    s.append(el('p',null,'箇条書きの項目も、すべて消えます。'));
    var r=el('div','btnrow');
    r.append(btn('やめる','', closeSheet), btn('削除する','pri', function(){
      closeSheet(); deleteMemoNow(m);
    }));
    s.append(r);
  });
}
function textOf(m){
  var out=[]; if(m.title.trim()) out.push(m.title.trim());
  if(m.body.trim()) m.body.split(/\r?\n/).forEach(function(l){ out.push(l); });
  var lines=[];
  (function walk(p, d){ p.ch.forEach(function(c){ if(c.a || (m.hideDone && c.x)) return; lines.push(new Array(d+1).join('　')+'・'+c.t); walk(c, d+1); }); })(m.root, 0);
  if(lines.length){ if(out.length) out.push(''); out=out.concat(lines); }
  return out.join('\n');
}
function copyText(m, msg){
  var t=textOf(m);
  function fail(){
    var ta; openSheet(function(s){ s.append(el('h2',null,'テキストとしてコピー')); s.append(el('p',null,'自動ではコピーできませんでした。下の文字をすべて選んで、コピーしてください。')); ta=document.createElement('textarea'); ta.className='copybox'; ta.readOnly=true; ta.value=t; ta.setAttribute('aria-label','コピーする文字'); s.append(ta); closeRow(s); });
    setTimeout(function(){ try{ ta.focus(); ta.select(); }catch(e){} }, 50);
  }
  try{ navigator.clipboard.writeText(t).then(function(){ msg.textContent='コピーしました。'; }, fail); }catch(e){ fail(); }
}

/* 設定 */
$('bSet').addEventListener('click', openSettings);
function openSettings(){
  openSheet(function(s){
    s.classList.add('panel');
    function group(title){ var g=el('div','pgroup'); g.append(el('h3',null,title)); s.append(g); return g; }
    function row(){ var r=el('div','pbtns'); for(var i=0;i<arguments.length;i++) r.append(arguments[i]); return r; }
    var hd=el('div','phead'); hd.append(el('h2',null,'設定'), btn('閉じる','', closeSheet)); s.append(hd);
    var g=group('カテゴリ');
    var na=countIn('archive');
    g.append(row(btn('カテゴリの編集','', function(){ openCatEditor(false, openSettings); }),
                 btn('アーカイブしたメモ'+(na ? '（'+na+'件）' : ''),'', function(){ closeSheet(); if(NARROW.matches && S.cur){ leaveCurrent(); S.cur=null; S.view='list'; } selectCat('archive'); render(); })));
    g=group('文字の大きさ');
    g.append(segOf([['l','大'],['m','中'],['s','小']], pref('size')||'m', function(v){ pref('size', v); applySize(); }));
    g=group('配色');
    g.append(segOf([['auto','端末の設定に合わせる'],['light','ライト'],['dark','ダーク']], pref('theme')||'auto', function(v){ pref('theme', v); applyTheme(); }));
    g.append(el('p','small','文字の大きさと配色は、この端末に記憶されます。'));
    g=group('バックアップ');
    var msg=el('p','msg'); msg.setAttribute('aria-live','polite');
    g.append(row(btn('すべてのメモをバックアップ','', function(){ exportBackup(msg); }),
                 btn('バックアップから戻す','', function(){ $('fileIn').value=''; $('fileIn').click(); }),
                 btn('削除したメモを戻す','', openDeleted)));
    g.append(el('p','small','すべてのメモとカテゴリを、1つのファイル（Tebikae-backup-日付.json）に保存します。戻すときは、そのファイルを選びます。'));
    g.append(msg);
    g=group('同期');
    syncSection(g);
    s.append(el('p','foot','Version '+VERSION));
  });
  if(!NARROW.matches){ sheet.setAttribute('tabindex','-1'); sheet.focus({ preventScroll:true }); }
}
function segOf(opts, curv, fn){
  var g=el('div','seg'); g.setAttribute('role','group');
  opts.forEach(function(o){ var b=el('button',null,o[1]); b.type='button'; b.setAttribute('aria-pressed', String(o[0]===curv)); b.addEventListener('click', function(){ g.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed','false'); }); b.setAttribute('aria-pressed','true'); fn(o[0]); }); g.append(b); });
  return g;
}
var darkMQ=window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
function applyTheme(){
  var t=pref('theme'); if(t==='light'||t==='dark') document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
  var meta=document.querySelector('meta[name="theme-color"]'), dark=t==='dark' || (t!=='light' && darkMQ && darkMQ.matches);
  if(meta) meta.setAttribute('content', dark ? '#131718' : '#F5F6F6');
}
if(darkMQ && darkMQ.addEventListener) darkMQ.addEventListener('change', applyTheme);
function applySize(){ var z=pref('size'), r=document.documentElement; r.classList.toggle('sz-l', z==='l'); r.classList.toggle('sz-s', z==='s'); setTimeout(function(){ sizeAll(); placeTools(); }, 30); }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function exportBackup(msg){
  var d=new Date(), payload={ app:'Tebikae', version:VERSION, kind:'all', exportedAt:d.toISOString(), categories:S.cats, memos:sortedMemos().map(function(m){ var x=serialize(m); x.id=m.id; return x; }) };
  msg.textContent='';
  flushAll(); Promise.resolve().then(function(){ return dl.save({ filename:'Tebikae-backup-'+ymd(d)+'.json', data:JSON.stringify(payload, null, 2) }); })
    .then(function(r){ if(r && r.status==='saved') msg.textContent='バックアップを保存しました。'; })
    .catch(function(e){ if(!(e && e.code==='declined')) msg.textContent='保存できませんでした。少し待ってから、もう一度お試しください。'; });
}
$('fileIn').addEventListener('change', function(){
  var f=this.files && this.files[0]; if(!f) return; var rd=new FileReader();
  rd.onload=function(){
    var data=null; try{ data=JSON.parse(String(rd.result)); }catch(e){}
    var ok=data && data.app==='Tebikae' && (Array.isArray(data.memos) || Array.isArray(data.notes));
    if(!ok){ openSheet(function(s){ s.append(el('h2',null,'このファイルは読み込めません')); s.append(el('p',null,'Tebikaeで保存したバックアップ（Tebikae-backup-日付.json）を選んでください。')); closeRow(s); }); return; }
    if(Array.isArray(data.memos)){
      openSheet(function(s){
        s.append(el('h2',null,'バックアップから戻しますか？'));
        s.append(el('p',null,'今あるメモ'+S.memos.size+'件とカテゴリを、バックアップのメモ'+data.memos.length+'件とカテゴリに置き換えます。今のメモは残りません。'));
        var r=el('div','btnrow'); r.append(btn('やめる','', closeSheet), btn('置き換える','pri', function(){ closeSheet(); applyBackup(data); })); s.append(r);
      });
    } else {
      var arr=data.notes.filter(function(x){ return x && typeof x==='object'; });
      openSheet(function(s){
        s.append(el('h2',null,'以前のノートを読み込みますか？'));
        s.append(el('p',null,'以前の形のバックアップです。ノート'+arr.length+'件を、未分類のメモとして加えます。今のメモはそのまま残ります。'));
        var r=el('div','btnrow'); r.append(btn('やめる','', closeSheet), btn('加える','pri', function(){
          closeSheet(); var now=Date.now();
          arr.forEach(function(x){ var m=deserialize(uid(), { title:x.title, body:'', cat:'', created:x.created||now, updated:now, hideDone:x.hideDone, items:x.items }); S.memos.set(m.id, m); markDirty(m.id); });
          render(); toast(arr.length+'件を未分類に加えました');
        })); s.append(r);
      });
    }
  };
  rd.readAsText(f);
});
function applyBackup(data){
  var old=Array.from(S.memos.keys()), now=Date.now();
  S.memos.forEach(function(m){ verSave(m, 'removed'); });
  S.memos.clear(); S.held.clear(); H.clear(); S.cur=null; S.view='list'; S.sel='inbox';
  S.cats=(Array.isArray(data.categories)?data.categories:[]).filter(function(c){ return c && typeof c.id==='string'; }).map(function(c){ return { id:c.id, name:String(c.name||'') }; });
  var keep=new Set();
  data.memos.forEach(function(x){ if(!x || typeof x!=='object') return; var id=(typeof x.id==='string' && /^[A-Za-z0-9_-]{1,80}$/.test(x.id)) ? x.id : uid(); if(id==='_meta') id=uid(); keep.add(id); var m=deserialize(id, x); m.updated=now; S.memos.set(id, m); markDirty(id); });
  saveMeta();
  old.forEach(function(id){ if(!keep.has(id)) removeMemoDoc(id); });
  render(); toast('バックアップから戻しました');
}

/* ⌘Z・⇧⌘Z・⌘N */
document.addEventListener('keydown', function(e){
  var mod=e.metaKey||e.ctrlKey; if(!mod || e.isComposing) return;
  var a=document.activeElement;
  if((e.key==='z'||e.key==='Z') && cur() && ov.hidden && a!==$('q') && a!==$('qin') && a!==$('qn')){ e.preventDefault(); e.stopPropagation(); if(e.shiftKey) redo(); else undo(); return; }
  if((e.key==='n'||e.key==='N') && !NARROW.matches && ov.hidden){ e.preventDefault(); if(S.sel==='archive') selectCat('inbox'); $('qin').focus(); }
}, true);
document.addEventListener('beforeinput', function(e){
  if(e.inputType!=='historyUndo' && e.inputType!=='historyRedo') return;
  if(!cur() || !$('memoCol').contains(document.activeElement)) return;
  e.preventDefault(); if(e.inputType==='historyUndo') undo(); else redo();
}, true);

/* 画面の変化 */
NARROW.addEventListener('change', function(){ if(!S.cur) S.view='list'; render(); });
window.addEventListener('resize', function(){ clearTimeout(sizeTimer); sizeTimer=setTimeout(function(){ sizeAll(); placeTools(); }, 120); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(sizeAll);
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') flushAll(); });
window.addEventListener('pagehide', function(){ if(localTimer) persistLocalNow(); });

/* 起動 */
applyTheme(); applySize();
var sv=pref('sel'); if(sv && sv!=='all') S.sel=sv;
render(); paintStatus();
loadLocal().then(function(){
  S.mode='ready';
  if(S.sel!=='inbox' && S.sel!=='archive' && !S.cats.some(function(c){ return c.id===S.sel; })) S.sel='inbox';
  render(); paintStatus();
  Store.init();
  setTimeout(verCleanup, 5000);
});
})();

  navigator.serviceWorker.register('sw.js').then(function(){ return navigator.serviceWorker.ready; })
